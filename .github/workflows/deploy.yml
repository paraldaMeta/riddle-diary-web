name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race: a queued run waits for the one in flight
# rather than cancelling it half-way through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Bundle and validate the Worker
        run: npm run check

      # Schema first: the Worker that goes out next expects it to be there.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CI: "1"

      # Worker secrets live in Cloudflare and are untouched by a deploy.
      - name: Deploy the Worker
        run: npx wrangler deploy
