<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Geomancer’s Book of Answers">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050403">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png" sizes="180x180">
  <link rel="stylesheet" href="/fonts/lxgw-wenkai.css">
  <link rel="stylesheet" href="/portal.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <title>The Geomancer’s Book of Answers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @font-face {
      font-family: 'Dancing Script';
      src: url('/fonts/dancing-script.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dancing Script';
      src: url('/fonts/dancing-script.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #ede4cf;
      --ink: #2a1810;
      --reply-ink: #1a0d08;
      --muted: #8b7d6b;
      --status: #b0a090;
      --guide-opacity: 0.76;
      --border: rgba(139,125,107,0.2);
      --veil:
        radial-gradient(ellipse at 50% 40%, rgba(255,250,232,0.6), transparent 55%),
        radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(101,67,33,0.22) 100%),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(120,90,50,0.018) 3px 4px),
        repeating-linear-gradient(90deg, transparent 0 5px, rgba(120,90,50,0.012) 5px 6px);
      --veil-size: auto, auto, auto, auto;
      --guide-shadow: 0 1px 0 rgba(255,255,255,0.35);
      --paper-noise-opacity: 0.05;
      --candle: 0;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --ink: #d8c4a0;
      --reply-ink: #f5e6c8;
      --muted: #b8b8b8;
      --status: #999;
      --guide-opacity: 0.9;
      --border: rgba(255,255,255,0.08);
      --veil:
        radial-gradient(ellipse at 50% 40%, rgba(140,110,70,0.18), transparent 50%),
        radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,0.88) 100%);
      --veil-size: auto, auto;
      --guide-shadow: 0 0 18px rgba(255,230,190,0.25);
      --paper-noise-opacity: 0.04;
      --candle: 1;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      transition: background 0.5s ease;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: var(--veil);
      background-size: var(--veil-size);
      z-index: 1;
    }

    /* Paper fiber noise (SVG turbulence, no image asset) */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: var(--paper-noise-opacity);
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.35 0 0 0 0 0.2 0 0 0 0.7 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      z-index: 1;
    }
    [data-theme="dark"] body::after { mix-blend-mode: screen; }

    /* Candle-breath ambient flicker (dark mode only) */
    #candle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: var(--candle);
      background: radial-gradient(ellipse at 50% 45%, rgba(255,180,90,0.06), transparent 60%);
      animation: candleFlicker 7s ease-in-out infinite;
    }
    @keyframes candleFlicker {
      0%, 100% { opacity: calc(var(--candle) * 0.8); }
      30% { opacity: var(--candle); }
      50% { opacity: calc(var(--candle) * 0.55); }
      70% { opacity: calc(var(--candle) * 0.95); }
    }

    /* Advanced membership media is loaded only after the server confirms the tier. */
    #premium-light {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      z-index: 1;
      transition: opacity 900ms ease, visibility 0s linear 900ms;
    }
    #premium-light video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.68;
      mix-blend-mode: screen;
      filter: saturate(0.78) contrast(1.05);
      transform: scale(1.04);
      animation: premiumLightFloat 18s ease-in-out infinite alternate;
    }
    body.premium-member #premium-light {
      opacity: 1;
      visibility: visible;
      transition: opacity 900ms ease;
    }
    body.premium-member #premium-light.premium-unavailable { opacity: 0; visibility: hidden; }
    #premium-light.premium-unavailable { opacity: 0; visibility: hidden; }
    #premium-light[hidden] { display: none; }
    @keyframes premiumLightFloat {
      from { transform: scale(1.04) translate3d(-0.6%, -0.4%, 0); }
      to { transform: scale(1.08) translate3d(0.6%, 0.4%, 0); }
    }

    /* Author signature */
    #watermark {
      position: fixed;
      bottom: 1.5rem; right: 1.8rem;
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem;
      color: var(--muted);
      opacity: 0.18;
      pointer-events: none;
      z-index: 1;
      transform: rotate(-4deg);
      letter-spacing: 0.15em;
      font-style: italic;
    }

    #paper {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: crosshair;
      z-index: 2;
    }
    /* In a browser tab WebGL can present the ink; installed apps keep this exact 2D surface. */
    body.three-ok #paper { opacity: 0; }

    /* ---- Guide overlay ---- */
    #guide {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.3rem;
      color: var(--muted);
      font-family: 'Georgia', serif;
      pointer-events: none;
      opacity: 1;
      transition: opacity 2s ease;
      z-index: 10;
      text-align: center;
      padding: 1.5rem;
    }
    #guide.hidden { opacity: 0; }
    #guide .title {
      font-family: 'Dancing Script', Georgia, serif;
      font-size: clamp(2rem, 7vw, 4rem);
      font-style: italic;
      line-height: 1.05;
      letter-spacing: 0.02em;
      max-width: min(900px, 92vw);
      text-wrap: balance;
      color: var(--reply-ink);
      opacity: 0.92;
      text-shadow: var(--guide-shadow);
    }
    #guide .title span { display: block; white-space: nowrap; }
    #guide .hint {
      font-family: 'LXGW WenKai Lite', 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      opacity: var(--guide-opacity);
      max-width: min(36em, 88vw);
      line-height: 1.7;
      text-wrap: balance;
    }
    /* ---- Status bar ---- */
    #status {
      position: fixed;
      bottom: 1rem; left: 50%;
      transform: translateX(-50%);
      font-family: 'Georgia', serif;
      font-size: 0.8rem;
      color: var(--status);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 20;
      pointer-events: none;
    }
    #status.visible { opacity: 0.6; }
    #status.status-recovery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      width: min(92vw, 760px);
      padding: 0.72rem 1rem 0.8rem;
      border: 1px solid rgba(216, 187, 132, 0.2);
      border-radius: 16px;
      background: rgba(8, 6, 4, 0.84);
      color: var(--status);
      opacity: 0.98;
      pointer-events: auto;
      max-height: calc(100dvh - 1rem);
      overflow-y: auto;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
    }
    #status.status-recovery .status-recovery-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.45rem 0.6rem;
      color: var(--reply-ink);
      pointer-events: auto;
      font-family: 'LXGW WenKai Lite', 'Kaiti SC', serif;
      font-size: 0.88rem;
      line-height: 1.4;
    }
    #status.status-recovery .status-recovery-label { color: var(--status); }
    #status.status-recovery .status-recovery-button {
      min-height: 34px;
      padding: 0.42rem 0.8rem;
      border: 1px solid rgba(216, 187, 132, 0.26);
      border-radius: 999px;
      background: rgba(216, 187, 132, 0.06);
      color: var(--reply-ink);
      font: inherit;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
    }
    #status.status-recovery .status-recovery-button:hover,
    #status.status-recovery .status-recovery-button:focus-visible,
    #status.status-recovery .status-recovery-button.active {
      border-color: rgba(216, 187, 132, 0.72);
      background: rgba(216, 187, 132, 0.16);
      color: var(--reply-ink);
      outline: none;
    }
    #status.status-recovery .status-recovery-button.primary {
      border-color: rgba(243, 223, 182, 0.5);
      background: rgba(243, 223, 182, 0.88);
      color: #120d07;
    }
    #thinking-dots { display: inline-flex; gap: 4px; margin-left: 4px; }
    #thinking-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--status);
      animation: pulse 1.4s infinite ease-in-out;
    }
    #thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    #thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    /* ---- Install affordance ------------------------------------------------ */
    #install-app {
      position: relative;
      z-index: 1;
      pointer-events: auto;
      min-height: 44px;
      margin-top: 0.15rem;
      padding: 0.68rem 1.35rem;
      border: 1px solid color-mix(in srgb, var(--reply-ink) 30%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      color: var(--reply-ink);
      font: 400 0.92rem/1 'LXGW WenKai Lite', 'Kaiti SC', serif;
      letter-spacing: 0.08em;
      cursor: pointer;
      opacity: 0.8;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 180ms ease, border-color 180ms ease, transform 180ms ease;
    }
    #install-app:hover, #install-app:focus-visible {
      opacity: 1;
      border-color: color-mix(in srgb, var(--reply-ink) 58%, transparent);
      outline: none;
      transform: translateY(-1px);
    }
    #install-app[hidden] { display: none; }
    #guide.hidden #install-app { pointer-events: none; }

    @media (max-height: 420px) {
      #guide {
        gap: 0.45rem;
        justify-content: flex-start;
        overflow-y: auto;
        padding: 0.6rem;
      }
      #guide .title {
        font-size: clamp(1.45rem, 7vw, 2.6rem);
        margin-top: 0.2rem;
      }
      #guide .title span { white-space: normal; }
      #guide .hint {
        max-width: 92vw;
        font-size: 0.88rem;
        line-height: 1.35;
      }
      #install-app {
        position: static;
        margin-top: 0.2rem;
      }
    }

  </style>
</head>
<body>
  <canvas id="paper"></canvas>
  <div id="candle"></div>
  <div id="premium-light" hidden aria-hidden="true"><video id="premium-animation" muted playsinline preload="metadata"></video></div>
  <div id="watermark">Oscar Grey</div>

  <button id="account-button" type="button" aria-label="打开登录与帐号页面">入</button>

  <div id="guide">
    <div class="title" aria-label="The Geomancer’s Book of Answers">
      <span aria-hidden="true">The Geomancer’s</span>
      <span aria-hidden="true">Book of Answers</span>
    </div>
    <div class="hint">写上你的问题，地占解答书将会为你解答。</div>
    <button id="install-app" type="button">安装到设备</button>
  </div>

  <div id="status"></div>

  <div id="portal-root"></div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.166.1/build/three.module.js" } }
  </script>
  <script type="module">
  import { createMusicController } from '/music.js';
  import { createPortal } from '/portal.js';
  import { figureLabel, getLocale, t } from '/i18n.js';

  (() => {
  'use strict';

  const LOCALE = getLocale();
  const copy = key => t(key, LOCALE);

  // ---- Config --------------------------------------------------------------
  const IDLE_MS = 2800;
  const FADE_DURATION = 1200;
  const ERASER_RADIUS = 30;
  const LINE_WIDTH = 2.5;
  const MIN_PRESSURE = 0.15;
  const REPLY_FONT_SIZE = 28;
  const REPLY_LINE_HEIGHT = 1.5;
  const REPLY_FONT_FAMILY = '"LXGW WenKai Lite", "Kaiti SC", "STKaiti", serif';
  const ENGLISH_REPLY_FONT_FAMILY = '"Dancing Script", cursive';

  const STANDALONE_APP = Boolean(
    (window.matchMedia && (
      window.matchMedia('(display-mode: standalone)').matches ||
      window.matchMedia('(display-mode: fullscreen)').matches ||
      window.matchMedia('(display-mode: minimal-ui)').matches
    )) || window.navigator.standalone === true
  );

  // Remove browser-side provider credentials left by earlier versions.
  try {
    localStorage.removeItem('riddle-settings-v2');
    localStorage.removeItem('riddle-settings');
  } catch(e) {}

  // ---- DOM -----------------------------------------------------------------
  var canvas = document.getElementById('paper');
  var ctx = canvas.getContext('2d', { willReadFrequently: false });
  var guideEl = document.getElementById('guide');
  var guideTitleEl = guideEl.querySelector('.title');
  var guideHintEl = guideEl.querySelector('.hint');
  var statusEl = document.getElementById('status');
  var installAppEl = document.getElementById('install-app');
  var accountButtonEl = document.getElementById('account-button');
  var premiumLightEl = document.getElementById('premium-light');
  var premiumVideoEl = document.getElementById('premium-animation');

  document.documentElement.lang = LOCALE === 'en' ? 'en' : 'zh-CN';
  document.title = copy('brand');
  document.querySelector('meta[name="apple-mobile-web-app-title"]').content = copy('brand');
  guideTitleEl.replaceChildren();
  if (LOCALE === 'en') {
    ['The Geomancer’s', 'Book of Answers'].forEach(function(line) {
      var titleLine = document.createElement('span');
      titleLine.setAttribute('aria-hidden', 'true');
      titleLine.textContent = line;
      guideTitleEl.appendChild(titleLine);
    });
  } else {
    var titleLine = document.createElement('span');
    titleLine.setAttribute('aria-hidden', 'true');
    titleLine.textContent = copy('brand');
    guideTitleEl.appendChild(titleLine);
  }
  guideTitleEl.setAttribute('aria-label', copy('brand'));
  guideHintEl.textContent = copy('guideHint');
  installAppEl.textContent = copy('install');
  accountButtonEl.textContent = copy('accountSignIn');
  accountButtonEl.setAttribute('aria-label', copy('accountLabelSignIn'));

  // ---- Canvas sizing -------------------------------------------------------
  var dpr = window.devicePixelRatio || 1;
  var canvasWidth = 1, canvasHeight = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var w = rect.width || document.documentElement.clientWidth || window.innerWidth;
    var h = rect.height || document.documentElement.clientHeight || window.innerHeight;
    canvasWidth = Math.max(1, w);
    canvasHeight = Math.max(1, h);
    canvas.width = Math.max(1, Math.round(canvasWidth * dpr));
    canvas.height = Math.max(1, Math.round(canvasHeight * dpr));
    ctx.setTransform(canvas.width / canvasWidth, 0, 0, canvas.height / canvasHeight, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (Array.isArray(strokes) && strokes.length) redrawAllStrokes();
    if (three) three.dirty = true;
  }
  resize();
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('pageshow', function() { requestAnimationFrame(resize); });
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) requestAnimationFrame(function() { requestAnimationFrame(resize); });
  });

  // ---- Ink color from CSS var ----------------------------------------------
  function inkColor() {
    return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1a1a1a';
  }

  // ---- State ---------------------------------------------------------------
  var drawing = false, erasing = false;
  var inputMode = 'write';
  var lastX = 0, lastY = 0, lastP = 0;
  var strokes = [];
  var currentStroke = null;
  var idleTimer = null;
  var waiting = false, replyActive = false;
  var pendingRequestId = null;
  var recoveryEdited = false;
  var portal = null;
  var guideHideTimer = null;
  var premiumMember = false;
  var premiumAnimations = {};
  var premiumPlaybackToken = 0;
  var premiumHideTimer = null;

  function normalizePremiumAnimations(animations) {
    if (typeof animations === 'string' && animations) {
      return { lumos: animations, map: animations, flourish: animations };
    }
    if (!animations || typeof animations !== 'object') return {};
    return Object.keys(animations).reduce(function(result, key) {
      if (typeof animations[key] === 'string' && animations[key]) result[key] = animations[key];
      return result;
    }, {});
  }

  function hidePremiumAnimation() {
    premiumPlaybackToken += 1;
    clearTimeout(premiumHideTimer);
    premiumHideTimer = null;
    premiumVideoEl.pause();
    premiumVideoEl.onended = null;
    premiumVideoEl.onerror = null;
    premiumVideoEl.removeAttribute('src');
    delete premiumVideoEl.dataset.source;
    delete premiumVideoEl.dataset.stage;
    premiumLightEl.hidden = true;
    premiumLightEl.classList.remove('premium-unavailable');
  }

  function playPremiumStage(stage) {
    if (!premiumMember) return;
    var source = premiumAnimations[stage];
    if (!source) {
      if (stage === 'map') return playPremiumStage('flourish');
      if (stage === 'lumos' && premiumAnimations.map) return playPremiumStage('map');
      return hidePremiumAnimation();
    }

    var token = ++premiumPlaybackToken;
    clearTimeout(premiumHideTimer);
    premiumHideTimer = null;
    premiumLightEl.hidden = false;
    premiumLightEl.classList.remove('premium-unavailable');
    premiumVideoEl.dataset.stage = stage;
    premiumVideoEl.onended = function() {
      if (token !== premiumPlaybackToken) return;
      if (stage === 'map') return playPremiumStage('flourish');
      premiumHideTimer = setTimeout(function() {
        if (token === premiumPlaybackToken) hidePremiumAnimation();
      }, 650);
    };
    premiumVideoEl.onerror = function() {
      if (token !== premiumPlaybackToken) return;
      premiumLightEl.classList.add('premium-unavailable');
      if (stage === 'map') return playPremiumStage('flourish');
      premiumHideTimer = setTimeout(function() {
        if (token === premiumPlaybackToken) hidePremiumAnimation();
      }, 250);
    };
    if (premiumVideoEl.dataset.source !== source) {
      premiumVideoEl.dataset.source = source;
      premiumVideoEl.src = source;
      premiumVideoEl.load();
    } else {
      try { premiumVideoEl.currentTime = 0; } catch (error) {}
    }
    premiumVideoEl.play().catch(function() {});
  }

  function updatePremiumAnimation(membership, animations) {
    var active = membership && membership.tier === 'advanced' &&
      ['active', 'trialing', 'past_due'].includes(membership.status);
    premiumMember = Boolean(active);
    premiumAnimations = normalizePremiumAnimations(animations);
    document.body.classList.toggle('premium-member', Boolean(active));
    if (!premiumMember || !Object.keys(premiumAnimations).length) return hidePremiumAnimation();
    playPremiumStage('lumos');
  }

  premiumVideoEl.addEventListener('loadeddata', function() { premiumLightEl.classList.remove('premium-unavailable'); });
  premiumVideoEl.addEventListener('error', function() {
    premiumLightEl.classList.add('premium-unavailable');
  });

  // ---- Helpers --------------------------------------------------------------
  function getPoint(e) {
    var r = canvas.getBoundingClientRect();
    var scaleX = r.width ? canvasWidth / r.width : 1;
    var scaleY = r.height ? canvasHeight / r.height : 1;
    return {
      x: (e.clientX - r.left) * scaleX,
      y: (e.clientY - r.top) * scaleY,
      p: e.pressure > 0 ? e.pressure : 0.5,
      t: e.timeStamp,
    };
  }

  function showStatus(msg, dots) {
    statusEl.classList.remove('status-recovery');
    statusEl.replaceChildren(document.createTextNode(msg));
    if (dots) {
      var dotsEl = document.createElement('span');
      dotsEl.id = 'thinking-dots';
      dotsEl.append(document.createElement('span'), document.createElement('span'), document.createElement('span'));
      statusEl.appendChild(dotsEl);
    }
    statusEl.classList.add('visible');
  }
  function showRecoveryStatus(msg) {
    showStatus(msg, false);
    statusEl.classList.add('status-recovery');
    var actions = document.createElement('div');
    actions.className = 'status-recovery-actions';
    actions.innerHTML = '<span class="status-recovery-label">' + copy('recoveryRewrite') + '</span>' +
      '<button class="status-recovery-button primary" type="button" data-status-action="clear">' + copy('recoveryClear') + '</button>' +
      '<span class="status-recovery-label">' + copy('recoveryModify') + '</span>' +
      '<button class="status-recovery-button" type="button" data-status-action="erase">' + copy('recoveryErase') + '</button>' +
      '<button class="status-recovery-button" type="button" data-status-action="write">' + copy('recoveryWrite') + '</button>';
    statusEl.appendChild(actions);
    statusEl.querySelector('[data-status-action="clear"]').addEventListener('click', clearWriting);
    statusEl.querySelector('[data-status-action="erase"]').addEventListener('click', function() { setInputMode('erase'); });
    statusEl.querySelector('[data-status-action="write"]').addEventListener('click', function() { setInputMode('write'); });
    updateRecoveryModeButtons();
  }
  function updateRecoveryModeButtons() {
    statusEl.querySelectorAll('[data-status-action]').forEach(function(button) {
      button.classList.toggle('active', button.dataset.statusAction === inputMode);
    });
  }
  function setInputMode(mode) {
    if (mode !== 'erase' && mode !== 'write') return;
    inputMode = mode;
    cancelIdle();
    if (mode === 'write' && recoveryEdited && strokes.length && !waiting && !replyActive) scheduleIdle();
    updateRecoveryModeButtons();
  }
  function clearWriting() {
    if (waiting || replyActive) return;
    cancelIdle();
    drawing = false;
    erasing = false;
    inputMode = 'write';
    pendingRequestId = null;
    recoveryEdited = false;
    strokes = [];
    clearCanvas();
    hideStatus();
    showGuide();
  }
  function hideStatus() { statusEl.classList.remove('visible', 'status-recovery'); }

  function hideGuide() {
    clearTimeout(guideHideTimer);
    guideEl.classList.add('hidden');
    guideHideTimer = setTimeout(function() {
      if (guideEl.classList.contains('hidden')) guideEl.style.display = 'none';
    }, 2000);
  }
  function showGuide() {
    clearTimeout(guideHideTimer);
    guideEl.style.display = 'flex';
    guideEl.classList.remove('hidden');
  }

  function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

  // ---- 3D layer (ponytail: optional, app still works if it fails) ----------
  // 2D canvas stays as input + drawing surface; it's also uploaded to a tilted
  // plane via CanvasTexture. Parallax + sway only. No raycast input rewrite.
  var three = { dirty: true, ok: false };
  function markDirty() { three.dirty = true; }
  function initThree() {
    import('three').then(function(THREE) {
      try {
        var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setSize(canvasWidth, canvasHeight);
        Object.assign(renderer.domElement.style, {
          position: 'fixed', inset: '0', zIndex: '3', pointerEvents: 'none',
        });
        document.body.appendChild(renderer.domElement);
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(40, canvasWidth / canvasHeight, 0.1, 50);
        camera.position.set(0, -0.6, 4.4);
        camera.lookAt(0, 0, 0);
        var texture = new THREE.CanvasTexture(canvas);
        var H = 4.0;
        var plane = new THREE.Mesh(
          new THREE.PlaneGeometry(H * (canvasWidth / canvasHeight), H),
          new THREE.MeshBasicMaterial({ map: texture, transparent: true })
        );
        plane.rotation.x = -0.10;
        scene.add(plane);
        var mx = 0, my = 0;
        window.addEventListener('pointermove', function(e) {
          mx = (e.clientX / window.innerWidth) * 2 - 1;
          my = (e.clientY / window.innerHeight) * 2 - 1;
        });
        window.addEventListener('resize', function() {
          camera.aspect = canvasWidth / canvasHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(canvasWidth, canvasHeight);
          plane.geometry.dispose();
          plane.geometry = new THREE.PlaneGeometry(H * (canvasWidth / canvasHeight), H);
        });
        var t0 = performance.now();
        renderer.setAnimationLoop(function(now) {
          var t = (now - t0) / 1000;
          plane.rotation.y = Math.sin(t * 0.4) * 0.02 + mx * 0.08;
          plane.rotation.x = -0.12 + my * 0.06;
          if (three.dirty) { texture.needsUpdate = true; three.dirty = false; }
          renderer.render(scene, camera);
        });
        three.ok = true;
        document.body.classList.add('three-ok');   // hide 2D canvas, plane is the ink now
      } catch (e) { /* no WebGL, no 3D */ }
    }).catch(function() { /* no network, no 3D */ });
  }
  if (!STANDALONE_APP && matchMedia('(prefers-reduced-motion: no-preference)').matches) initThree();

  // ---- Drawing -------------------------------------------------------------
  function drawStrokeDot(target, point, color, baseAlpha, offsetX, offsetY) {
    var pressure = Math.max(point.p, MIN_PRESSURE);
    var diameter = LINE_WIDTH * (0.5 + pressure * 1.5);
    target.save();
    target.fillStyle = color;
    target.globalAlpha = baseAlpha * (0.82 + pressure * 0.18);
    target.beginPath();
    target.arc(point.x - (offsetX || 0), point.y - (offsetY || 0), Math.max(1, diameter / 2), 0, Math.PI * 2);
    target.fill();
    target.restore();
  }

  function startStroke(pt) {
    if (replyActive || waiting) return;
    if (inputMode === 'erase') return;
    pendingRequestId = null;
    recoveryEdited = true;
    hideStatus();
    hideGuide();
    currentStroke = [pt];
    strokes.push(currentStroke);
    drawing = true; erasing = false;
    ctx.beginPath();
    ctx.moveTo(pt.x, pt.y);
  }

  function continueStroke(pt) {
    if (!drawing) return;
    currentStroke.push(pt);
    var p = Math.max(pt.p, MIN_PRESSURE);
    var midX = (lastX + pt.x) / 2, midY = (lastY + pt.y) / 2;
    ctx.strokeStyle = inkColor();
    ctx.globalAlpha = 0.82 + p * 0.18;   // wet-ink variance
    ctx.lineWidth = LINE_WIDTH * (0.5 + p * 1.5);
    ctx.quadraticCurveTo(lastX, lastY, midX, midY);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.moveTo(midX, midY);
    lastX = pt.x; lastY = pt.y; lastP = p;
    markDirty();
  }

  function endStroke() {
    if (!drawing) return;
    if (currentStroke && currentStroke.length === 1) {
      drawStrokeDot(ctx, currentStroke[0], inkColor(), 1, 0, 0);
      markDirty();
    } else if (currentStroke && currentStroke.length > 1) {
      var endpoint = currentStroke[currentStroke.length - 1];
      var pressure = Math.max(endpoint.p, MIN_PRESSURE);
      ctx.strokeStyle = inkColor();
      ctx.globalAlpha = 0.82 + pressure * 0.18;
      ctx.lineWidth = LINE_WIDTH * (0.5 + pressure * 1.5);
      ctx.lineTo(endpoint.x, endpoint.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      markDirty();
    }
    drawing = false; currentStroke = null;
    scheduleIdle();
  }

  function eraseAt(x, y) {
    pendingRequestId = null;
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, ERASER_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    markDirty();
    var previousPointCount = strokes.reduce(function(total, stroke) { return total + stroke.length; }, 0);
    strokes = strokes.map(function(s) {
      return s.filter(function(pt) { return Math.hypot(pt.x - x, pt.y - y) > ERASER_RADIUS; });
    }).filter(function(s) { return s.length > 0; });
    var nextPointCount = strokes.reduce(function(total, stroke) { return total + stroke.length; }, 0);
    if (nextPointCount !== previousPointCount) recoveryEdited = true;
  }

  // ---- Idle → commit -------------------------------------------------------
  function scheduleIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(commitPage, IDLE_MS); }
  function cancelIdle() { clearTimeout(idleTimer); }

  function isUnreadableError(error) {
    return Boolean(error && (
      error.code === 'HANDWRITING_UNREADABLE' || /无法(?:准确)?辨认/.test(error.message || '') ||
      /could not be read|unreadable/i.test(error.message || '')
    ));
  }

  // ---- Commit --------------------------------------------------------------
  async function commitPage() {
    if (strokes.length === 0 || waiting || replyActive) return;

    if (detectQuestionMark()) { showGuide(); strokes = []; clearCanvas(); return; }

    if (!portal || !await portal.ensureCanAsk()) return;

    waiting = true;
    playPremiumStage('lumos');
    showStatus(copy('statusAbsorb'), true);
    var savedStrokes = strokes.map(function(stroke) {
      return stroke.map(function(point) { return Object.assign({}, point); });
    });
    var png = exportPNG();
    pendingRequestId = pendingRequestId || (
      crypto && typeof crypto.randomUUID === 'function'
        ? crypto.randomUUID()
        : String(Date.now()) + '-' + Math.random().toString(36).slice(2)
    );
    await fadeOut();
    clearCanvas();
    strokes = [];

    try {
      var reply = await askOracle(png, pendingRequestId);
      pendingRequestId = null;
      portal.updateAfterAnswer(reply);
      hideStatus();
      replyActive = true;
      playPremiumStage('map');
      await animateReply(reply.text, reply.isPrediction ? reply : null);
      replyActive = false;
    } catch(err) {
      strokes = savedStrokes;
      clearCanvas();
      redrawAllStrokes();
      markDirty();
      if (isUnreadableError(err)) {
        pendingRequestId = null;
        recoveryEdited = false;
        showRecoveryStatus(err.message || copy('unreadable'));
      } else {
        portal.handleApiError(err);
        showStatus(err.message || copy('pageSilent'));
        setTimeout(hideStatus, 4000);
      }
    }
    waiting = false;
  }

  function detectQuestionMark() {
    if (strokes.length === 1 && strokes[0].length < 40) {
      var s = strokes[0];
      var xs = s.map(function(p) { return p.x; });
      var ys = s.map(function(p) { return p.y; });
      var w = Math.max.apply(null, xs) - Math.min.apply(null, xs);
      var h = Math.max.apply(null, ys) - Math.min.apply(null, ys);
      if (w < 60 && h < 80) return true;
    }
    return false;
  }

  function fadeOut() {
    return new Promise(function(resolve) {
      var alpha = 1, step = 0.04;
      var interval = setInterval(function() {
        alpha -= step;
        if (alpha <= 0) { clearInterval(interval); ctx.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr); resolve(); }
        ctx.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr);
        ctx.save();
        ctx.globalAlpha = alpha;
        redrawAllStrokes();
        ctx.restore();
        markDirty();
      }, FADE_DURATION * step);
    });
  }

  function redrawAllStrokes() {
    var ic = inkColor();
    var fade = ctx.globalAlpha;   // respect caller's fade alpha (set by fadeOut)
    for (var si = 0; si < strokes.length; si++) {
      var stroke = strokes[si];
      if (stroke.length === 1) {
        drawStrokeDot(ctx, stroke[0], ic, fade, 0, 0);
        continue;
      }
      if (stroke.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for (var i = 1; i < stroke.length; i++) {
        var p = stroke[i], prev = stroke[i-1];
        var midX = (prev.x + p.x)/2, midY = (prev.y + p.y)/2;
        var press = Math.max(p.p, MIN_PRESSURE);
        ctx.lineWidth = LINE_WIDTH * (0.5 + press * 1.5);
        ctx.strokeStyle = ic;
        ctx.globalAlpha = fade * (0.82 + press * 0.18);
        ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(midX, midY);
      }
      var endpoint = stroke[stroke.length - 1];
      var endPressure = Math.max(endpoint.p, MIN_PRESSURE);
      ctx.lineWidth = LINE_WIDTH * (0.5 + endPressure * 1.5);
      ctx.globalAlpha = fade * (0.82 + endPressure * 0.18);
      ctx.lineTo(endpoint.x, endpoint.y);
      ctx.stroke();
    }
    ctx.globalAlpha = fade;
  }

  function exportPNG() {
    var minX = canvasWidth, minY = canvasHeight, maxX = 0, maxY = 0;
    strokes.forEach(function(stroke) {
      stroke.forEach(function(point) {
        minX = Math.min(minX, point.x); minY = Math.min(minY, point.y);
        maxX = Math.max(maxX, point.x); maxY = Math.max(maxY, point.y);
      });
    });

    // Send the handwriting, not a mostly empty full-screen page. A generous
    // border keeps dots and line caps intact; small writing is enlarged up to 2×.
    var span = Math.max(maxX - minX, maxY - minY);
    var padding = Math.max(32, Math.min(72, span * 0.12));
    var left = Math.max(0, Math.floor(minX - padding));
    var top = Math.max(0, Math.floor(minY - padding));
    var right = Math.min(canvasWidth, Math.ceil(maxX + padding));
    var bottom = Math.min(canvasHeight, Math.ceil(maxY + padding));
    var w = Math.max(1, right - left), h = Math.max(1, bottom - top);
    var exportScale = Math.max(1, Math.min(2, 768 / Math.max(w, h)));
    var tmp = document.createElement('canvas');
    tmp.width = Math.max(1, Math.round(w * exportScale));
    tmp.height = Math.max(1, Math.round(h * exportScale));
    var t = tmp.getContext('2d');
    t.setTransform(tmp.width / w, 0, 0, tmp.height / h, 0, 0);
    // Use CSS bg color for export
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#f5f0e6';
    t.fillStyle = bg;
    t.fillRect(0, 0, w, h);
    var ic = inkColor();
    for (var si = 0; si < strokes.length; si++) {
      var stroke = strokes[si];
      if (stroke.length === 1) {
        drawStrokeDot(t, stroke[0], ic, 1, left, top);
        continue;
      }
      if (stroke.length < 2) continue;
      t.beginPath();
      t.moveTo(stroke[0].x - left, stroke[0].y - top);
      for (var i = 1; i < stroke.length; i++) {
        var p = stroke[i], prev = stroke[i-1];
        var midX = (prev.x + p.x)/2 - left, midY = (prev.y + p.y)/2 - top;
        var press = Math.max(p.p, MIN_PRESSURE);
        t.lineWidth = LINE_WIDTH * (0.5 + press * 1.5);
        t.strokeStyle = ic;
        t.globalAlpha = 0.82 + press * 0.18;
        t.lineCap = 'round'; t.lineJoin = 'round';
        t.quadraticCurveTo(prev.x - left, prev.y - top, midX, midY);
        t.stroke();
        t.beginPath();
        t.moveTo(midX, midY);
      }
      var endpoint = stroke[stroke.length - 1];
      var endPressure = Math.max(endpoint.p, MIN_PRESSURE);
      t.lineWidth = LINE_WIDTH * (0.5 + endPressure * 1.5);
      t.globalAlpha = 0.82 + endPressure * 0.18;
      t.lineTo(endpoint.x - left, endpoint.y - top);
      t.stroke();
    }
    t.globalAlpha = 1;
    return tmp.toDataURL('image/png');
  }

  function clearCanvas() { ctx.clearRect(0, 0, canvasWidth, canvasHeight); markDirty(); }

  // ---- Oracle: one authenticated, same-origin server connection ------------

  async function askOracle(pngDataUrl, requestId) {
    try {
      var response = await fetch('/api/ask', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requestId: requestId, image: pngDataUrl, locale: LOCALE }),
      });
      var payload = await response.json().catch(function() { return {}; });
      if (!response.ok) {
        var requestError = new Error(payload.error || ('请求失败（HTTP ' + response.status + '）'));
        requestError.status = response.status;
        requestError.code = payload.code || 'REQUEST_FAILED';
        throw requestError;
      }
      if (!payload.text) throw new Error(copy('noText'));
      return Object.assign({}, payload, { draw: payload.geomancy || null });
    } catch(error) {
      if (error instanceof TypeError || (error && error.name === 'AbortError')) {
        var networkError = new Error(copy('network'));
        networkError.code = 'NETWORK_ERROR';
        throw networkError;
      }
      if (error instanceof Error && error.message) throw error;
      throw new Error(copy('network'));
    }
  }

  function splitReplyUnits(text) {
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      return Array.from(new Intl.Segmenter('zh-CN', { granularity: 'word' }).segment(text), function(item) {
        return item.segment;
      });
    }
    return String(text).match(/[\u3400-\u9fff]|[^\u3400-\u9fff\s]+|\s+/g) || [];
  }

  function replyFontFor(text) {
    return /[A-Za-z]/.test(String(text)) ? ENGLISH_REPLY_FONT_FAMILY : REPLY_FONT_FAMILY;
  }

  function leftNameForSpeech(name) {
    return figureLabel(name, LOCALE);
  }

  // ---- Reply animation: Chinese-aware SVG ink fade-in -----------------------
  function appendSvgText(parent, text, x, y, fontSize, color, opacity) {
    var svgNS = 'http://www.w3.org/2000/svg';
    var element = document.createElementNS(svgNS, 'text');
    element.setAttribute('x', x);
    element.setAttribute('y', y);
    element.setAttribute('text-anchor', 'middle');
    element.setAttribute('font-family', REPLY_FONT_FAMILY);
    element.setAttribute('font-size', fontSize);
    element.setAttribute('fill', color);
    element.setAttribute('opacity', opacity);
    element.textContent = text;
    parent.appendChild(element);
  }

  function appendGeomancyFigure(parent, pattern, centerX, top, color, compact) {
    var svgNS = 'http://www.w3.org/2000/svg';
    var rowGap = compact ? 16 : 19;
    var pointGap = compact ? 8 : 10;
    var pointSize = compact ? 6 : 7;

    pattern.forEach(function(points, row) {
      var offsets = points === 1 ? [0] : [-pointGap, pointGap];
      offsets.forEach(function(offset) {
        var centerY = top + row * rowGap;
        var point = document.createElementNS(svgNS, 'rect');
        point.setAttribute('x', centerX + offset - pointSize / 2);
        point.setAttribute('y', centerY - pointSize / 2);
        point.setAttribute('width', pointSize);
        point.setAttribute('height', pointSize);
        point.setAttribute('rx', '0.8');
        point.setAttribute('fill', color);
        point.setAttribute('transform', 'rotate(45 ' + (centerX + offset) + ' ' + centerY + ')');
        parent.appendChild(point);
      });
    });
  }

  function appendGeomancyCombination(svg, oracle, width, height, color) {
    var svgNS = 'http://www.w3.org/2000/svg';
    var compact = width < 520;
    var top = Math.max(compact ? 54 : 64, height * 0.075);
    var spread = Math.min(width * 0.29, 180);
    var centers = [width / 2 - spread, width / 2, width / 2 + spread];
    var rowGap = compact ? 16 : 19;
    var labelY = top + rowGap * 3 + (compact ? 28 : 34);
    var metaY = labelY + (compact ? 30 : 36);
    var group = document.createElementNS(svgNS, 'g');
    group.style.opacity = '0';
    group.style.filter = 'blur(4px)';
    group.style.transition = 'opacity 1.2s ease, filter 1.4s ease';
    svg.appendChild(group);

    appendGeomancyFigure(group, oracle.draw.patterns.left, centers[0], top, color, compact);
    appendGeomancyFigure(group, oracle.draw.patterns.right, centers[1], top, color, compact);
    appendGeomancyFigure(group, oracle.draw.patterns.result, centers[2], top, color, compact);
    appendSvgText(group, '+', (centers[0] + centers[1]) / 2, top + rowGap * 1.7, compact ? 18 : 22, color, '0.55');
    appendSvgText(group, '=', (centers[1] + centers[2]) / 2, top + rowGap * 1.7, compact ? 18 : 22, color, '0.55');
    var leftName = figureLabel(oracle.draw.left, LOCALE);
    var rightName = figureLabel(oracle.draw.right, LOCALE);
    var resultName = figureLabel(oracle.draw.result, LOCALE);
    appendSvgText(group, leftName, centers[0], labelY, compact ? 14 : 16, color, '0.78');
    appendSvgText(group, rightName, centers[1], labelY, compact ? 14 : 16, color, '0.78');
    appendSvgText(group, resultName, centers[2], labelY, compact ? 14 : 16, color, '0.92');
    appendSvgText(group, LOCALE === 'en'
      ? 'Draw ' + oracle.draw.id + ' · ' + (oracle.topic === '基本卦义' ? copy('coreFigures') : oracle.topic)
      : '第 ' + oracle.draw.id + ' 组 · ' + oracle.topic, width / 2, metaY, compact ? 13 : 15, color, '0.62');

    setTimeout(function() {
      group.style.opacity = '0.94';
      group.style.filter = 'blur(0px)';
    }, 20);
    return metaY + (compact ? 46 : 54);
  }

  async function animateReply(text, oracle) {
    if (!text) return;
    var w = window.innerWidth, h = window.innerHeight;
    var maxWidth = w * 0.84, startX = w * 0.08;
    var fontSize = w < 480 ? (h < 700 ? 20 : 22) : REPLY_FONT_SIZE;

    if (document.fonts && document.fonts.load) {
      await Promise.race([
        Promise.all([
          document.fonts.load(fontSize + 'px "LXGW WenKai Lite"', text),
          document.fonts.load(fontSize + 'px "Dancing Script"', text),
        ]),
        sleep(3500),
      ]);
    }

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', (oracle
      ? leftNameForSpeech(oracle.draw.left) + (LOCALE === 'en' ? ' plus ' : '加') + leftNameForSpeech(oracle.draw.right) + (LOCALE === 'en' ? ' gives ' : '得到') + leftNameForSpeech(oracle.draw.result) + (LOCALE === 'en' ? ', topic ' : '，主题') + (oracle.topic === '基本卦义' ? copy('coreFigures') : oracle.topic) + (LOCALE === 'en' ? '.' : '。')
      : '') + text);
    svg.style.position = 'absolute';
    svg.style.top = '0'; svg.style.left = '0';
    svg.style.pointerEvents = 'none';
    svg.style.zIndex = '5';
    document.body.appendChild(svg);

    var replyColor = getComputedStyle(document.documentElement).getPropertyValue('--reply-ink').trim() || '#3a3028';
    var startY = oracle ? appendGeomancyCombination(svg, oracle, w, h, replyColor) : h * 0.18;

    var words = splitReplyUnits(text);
    var x = startX, y = startY;
    var lineHeight = fontSize * REPLY_LINE_HEIGHT;
    var maxRight = startX + maxWidth;

    var mc = document.createElement('canvas');
    var mctx = mc.getContext('2d');
    var wordSpans = [];
    for (var wi = 0; wi < words.length; wi++) {
      var pieces = String(words[wi] || '').split(/(\n)/);
      for (var pi = 0; pi < pieces.length; pi++) {
        var word = pieces[pi];
        if (!word) continue;
        if (word === '\n') { x = startX; y += lineHeight; continue; }
        var family = replyFontFor(word);
        mctx.font = fontSize + 'px ' + family;
        var ww = mctx.measureText(word).width;
        if (word.trim() && x + ww > maxRight) { x = startX; y += lineHeight; }
        if (!word.trim() && x === startX) continue;
        wordSpans.push({ text: word, x: x, y: y, family: family });
        x += ww;
      }
    }

    var delay = Math.max(35, Math.min(110, 7000 / Math.max(1, wordSpans.length)));
    for (var i = 0; i < wordSpans.length; i++) {
      var ws = wordSpans[i];
      var el = document.createElementNS(svgNS, 'text');
      el.setAttribute('x', ws.x);
      el.setAttribute('y', ws.y);
      el.setAttribute('font-family', ws.family);
      el.setAttribute('font-size', fontSize);
      el.setAttribute('fill', replyColor);
      el.style.opacity = '0';
      el.style.filter = 'blur(3px)';
      el.style.transition = 'opacity 0.9s ease, filter 1.1s ease';
      el.textContent = ws.text;
      svg.appendChild(el);
      (function(elm) {
        setTimeout(function() {
          elm.style.opacity = '0.92';
          elm.style.filter = 'blur(0px)';
        }, 0);
      })(el);
      await sleep(delay);
    }

    await sleep(Math.min(10000, Math.max(3500, text.length * 35)));
    svg.style.transition = 'opacity 2s ease';
    svg.style.opacity = '0';
    await sleep(2000);
    svg.remove();
  }

  // ---- PWA installation -----------------------------------------------------
  var pendingInstallPrompt = null;
  if (STANDALONE_APP) installAppEl.hidden = true;
  window.addEventListener('beforeinstallprompt', function(event) {
    event.preventDefault();
    pendingInstallPrompt = event;
    if (!STANDALONE_APP) installAppEl.hidden = false;
  });

  installAppEl.addEventListener('click', async function() {
    window.dispatchEvent(new CustomEvent('geomancer:install-start'));
    if (pendingInstallPrompt) {
      await pendingInstallPrompt.prompt();
      var choice = await pendingInstallPrompt.userChoice;
      pendingInstallPrompt = null;
      if (choice && choice.outcome === 'accepted') installAppEl.hidden = true;
      return;
    }
    var appleMobile = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var help = appleMobile
      ? copy('installIos')
      : copy('installBrowser');
    if (portal) portal.toast(help); else showStatus(help);
  });

  window.addEventListener('appinstalled', function() {
    pendingInstallPrompt = null;
    installAppEl.hidden = true;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').catch(function(error) {
        console.warn('离线服务注册失败：', error);
      });
    });
  }

  // ---- Preserve the current page across OAuth and Stripe redirects ---------
  const DRAFT_KEY = 'geomancer-external-draft-v1';
  function saveExternalDraft() {
    try {
      if (!strokes.length) { localStorage.removeItem(DRAFT_KEY); return; }
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        expiresAt: Date.now() + 2 * 60 * 60 * 1000,
        requestId: pendingRequestId,
        strokes: strokes.map(function(stroke) {
          return stroke.map(function(point) {
            return { x: point.x / canvasWidth, y: point.y / canvasHeight, p: point.p, t: point.t };
          });
        }),
      }));
    } catch(e) {}
  }

  function restoreExternalDraft() {
    try {
      var draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      localStorage.removeItem(DRAFT_KEY);
      if (!draft || draft.expiresAt < Date.now() || !Array.isArray(draft.strokes)) return;
      strokes = draft.strokes.slice(0, 500).map(function(stroke) {
        return Array.isArray(stroke) ? stroke.slice(0, 5000).map(function(point) {
          var x = Number(point.x), y = Number(point.y), p = Number(point.p);
          if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
          return {
            x: Math.max(0, Math.min(1, x)) * canvasWidth,
            y: Math.max(0, Math.min(1, y)) * canvasHeight,
            p: Number.isFinite(p) ? Math.max(0, Math.min(1, p)) : 0.5,
            t: Number(point.t) || 0,
          };
        }).filter(Boolean) : [];
      }).filter(function(stroke) { return stroke.length; });
      pendingRequestId = typeof draft.requestId === 'string' ? draft.requestId : null;
      if (strokes.length) {
        clearCanvas();
        redrawAllStrokes();
        markDirty();
        hideGuide();
      }
    } catch(e) {}
  }

  var music = createMusicController();
  portal = createPortal({
    music: music,
    beforeExternal: saveExternalDraft,
    restoreExternal: restoreExternalDraft,
    onMembershipChange: updatePremiumAnimation,
  });
  window.addEventListener('geomancer:auth-open', function() {
    cancelIdle();
    hideGuide();
  });
  window.addEventListener('geomancer:auth-close', function() {
    if (!strokes.length && !replyActive) showGuide();
  });

  // ---- Pointer events ------------------------------------------------------
  canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault(); cancelIdle();
    if (inputMode === 'erase' || e.button === 2 || e.tiltY > 40 || (e.buttons & 2)) {
      erasing = true; var pt = getPoint(e); eraseAt(pt.x, pt.y); return;
    }
    var pt = getPoint(e);
    lastX = pt.x; lastY = pt.y; lastP = pt.p;
    startStroke(pt);
  });
  canvas.addEventListener('pointermove', function(e) {
    e.preventDefault();
    if (erasing) { var pt = getPoint(e); eraseAt(pt.x, pt.y); return; }
    if (!drawing) return;
    continueStroke(getPoint(e));
  });
  canvas.addEventListener('pointerup', function(e) {
    e.preventDefault();
    if (erasing) { erasing = false; if (inputMode === 'write') scheduleIdle(); return; }
    endStroke();
  });
  canvas.addEventListener('pointercancel', function() {
    if (erasing) { erasing = false; if (inputMode === 'write') scheduleIdle(); return; }
    endStroke();
  });
  canvas.addEventListener('pointerleave', function() { if (drawing) endStroke(); });
  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (portal && portal.isOpen()) { portal.close(); return; }
      cancelIdle(); clearCanvas(); strokes = []; inputMode = 'write';
      pendingRequestId = null;
      waiting = false; replyActive = false; hideStatus();
    }
  });

  document.addEventListener('touchmove', function(e) {
    if (!e.target.closest('.portal-drawer')) e.preventDefault();
  }, { passive: false });
  scheduleIdle();
  })();
  </script>
</body>
</html>
