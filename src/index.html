<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Book of Geomancy Answers">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050403">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png" sizes="180x180">
  <title>The Book of Geomancy Answers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @font-face {
      font-family: 'Dancing Script';
      src: url('https://fonts.gstatic.com/s/dancingscript/v29/If2RXTr6YS-zF4S-kcSWSVi_szLgiuE.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LXGW WenKai Hint';
      src: url('/fonts/lxgw-wenkai-hint.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dancing Script';
      src: url('https://fonts.gstatic.com/s/dancingscript/v29/If2RXTr6YS-zF4S-kcSWSVi_szLgiuE.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #ede4cf;
      --ink: #2a1810;
      --reply-ink: #1a0d08;
      --muted: #8b7d6b;
      --status: #b0a090;
      --guide-opacity: 0.76;
      --border: rgba(139,125,107,0.2);
      --veil:
        radial-gradient(ellipse at 50% 40%, rgba(255,250,232,0.6), transparent 55%),
        radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(101,67,33,0.22) 100%),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(120,90,50,0.018) 3px 4px),
        repeating-linear-gradient(90deg, transparent 0 5px, rgba(120,90,50,0.012) 5px 6px);
      --veil-size: auto, auto, auto, auto;
      --guide-shadow: 0 1px 0 rgba(255,255,255,0.35);
      --paper-noise-opacity: 0.05;
      --candle: 0;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --ink: #d8c4a0;
      --reply-ink: #f5e6c8;
      --muted: #b8b8b8;
      --status: #999;
      --guide-opacity: 0.9;
      --border: rgba(255,255,255,0.08);
      --veil:
        radial-gradient(ellipse at 50% 40%, rgba(140,110,70,0.18), transparent 50%),
        radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,0.88) 100%);
      --veil-size: auto, auto;
      --guide-shadow: 0 0 18px rgba(255,230,190,0.25);
      --paper-noise-opacity: 0.04;
      --candle: 1;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      transition: background 0.5s ease;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: var(--veil);
      background-size: var(--veil-size);
      z-index: 1;
    }

    /* Paper fiber noise (SVG turbulence, no image asset) */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: var(--paper-noise-opacity);
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.35 0 0 0 0 0.2 0 0 0 0.7 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      z-index: 1;
    }
    [data-theme="dark"] body::after { mix-blend-mode: screen; }

    /* Candle-breath ambient flicker (dark mode only) */
    #candle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: var(--candle);
      background: radial-gradient(ellipse at 50% 45%, rgba(255,180,90,0.06), transparent 60%);
      animation: candleFlicker 7s ease-in-out infinite;
    }
    @keyframes candleFlicker {
      0%, 100% { opacity: calc(var(--candle) * 0.8); }
      30% { opacity: var(--candle); }
      50% { opacity: calc(var(--candle) * 0.55); }
      70% { opacity: calc(var(--candle) * 0.95); }
    }

    /* Geomancy watermark */
    #watermark {
      position: fixed;
      bottom: 1.5rem; right: 1.8rem;
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem;
      color: var(--muted);
      opacity: 0.18;
      pointer-events: none;
      z-index: 1;
      transform: rotate(-4deg);
      letter-spacing: 0.15em;
      font-style: italic;
    }

    #paper {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: crosshair;
      z-index: 2;
    }
    /* In a browser tab WebGL can present the ink; installed apps keep this exact 2D surface. */
    body.three-ok #paper { opacity: 0; }

    /* ---- Guide overlay ---- */
    #guide {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.3rem;
      color: var(--muted);
      font-family: 'Georgia', serif;
      pointer-events: none;
      opacity: 1;
      transition: opacity 2s ease;
      z-index: 10;
      text-align: center;
      padding: 1.5rem;
    }
    #guide.hidden { opacity: 0; }
    #guide .title {
      font-family: 'Dancing Script', Georgia, serif;
      font-size: clamp(2rem, 7vw, 4rem);
      font-style: italic;
      line-height: 1.05;
      letter-spacing: 0.02em;
      max-width: min(900px, 92vw);
      text-wrap: balance;
      color: var(--reply-ink);
      opacity: 0.92;
      text-shadow: var(--guide-shadow);
    }
    #guide .hint {
      font-family: 'LXGW WenKai Hint', 'LXGW WenKai', 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      opacity: var(--guide-opacity);
      max-width: min(36em, 88vw);
      line-height: 1.7;
      text-wrap: balance;
    }
    #guide .gestures {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 0.7rem 1.2rem; font-size: 0.78rem;
      opacity: calc(var(--guide-opacity) * 0.82); margin-top: 0.2rem;
      max-width: min(560px, 92vw);
    }
    #guide .gestures span { display: flex; align-items: center; gap: 0.4rem; }

    /* ---- Status bar ---- */
    #status {
      position: fixed;
      bottom: 1rem; left: 50%;
      transform: translateX(-50%);
      font-family: 'Georgia', serif;
      font-size: 0.8rem;
      color: var(--status);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 20;
      pointer-events: none;
    }
    #status.visible { opacity: 0.6; }
    #thinking-dots { display: inline-flex; gap: 4px; margin-left: 4px; }
    #thinking-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--status);
      animation: pulse 1.4s infinite ease-in-out;
    }
    #thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    #thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    /* ---- Settings gear ---- */
    #gear {
      position: fixed;
      top: 0.5rem; right: 0.5rem;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      color: var(--muted);
      opacity: 0.3;
      z-index: 30;
      cursor: pointer;
      transition: opacity 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      border: 0;
      background: transparent;
    }
    #gear:hover { opacity: 0.7; }

    /* ---- Install affordance (shown only when the browser offers PWA install) ---- */
    #install-app {
      position: fixed;
      top: 0.75rem; left: 0.75rem;
      z-index: 30;
      padding: 0.45rem 0.72rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      color: var(--muted);
      font: 0.75rem Georgia, serif;
      cursor: pointer;
      opacity: 0.72;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #install-app:hover { opacity: 1; }
    #install-app[hidden] { display: none; }

    /* ---- Settings panel ---- */
    #settings {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #settings.open { display: flex; }
    #settings .panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 680px;
      max-height: min(88vh, 760px);
      overflow-y: auto;
      width: min(92%, 680px);
      font-family: "Songti SC", "STSong", Georgia, serif;
      color: var(--ink);
    }
    #settings h2 {
      font-size: 1.1rem; font-style: italic; margin-bottom: 1rem;
      color: var(--muted);
    }
    #settings label {
      display: block; font-size: 0.75rem; color: var(--muted);
      margin-top: 0.8rem; margin-bottom: 0.2rem;
    }
    #settings input, #settings select {
      width: 100%; padding: 0.5rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font-size: 0.85rem;
      font-family: monospace;
    }
    #settings input:focus, #settings select:focus { outline: none; border-color: var(--reply-ink); }
    #settings .profile-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.65rem;
      align-items: end;
      padding: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    #settings .profile-bar label { margin: 0; }
    #settings .profile-actions { display: flex; gap: 0.4rem; }
    #settings .profile-actions button { min-width: 3.5rem; }
    #settings .settings-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0 0.75rem;
    }
    #settings .field-wide { grid-column: 1 / -1; }
    #settings .field-base[hidden] { display: none; }
    #settings .row {
      display: flex; gap: 0.5rem; align-items: center;
      margin-top: 1rem;
    }
    #settings .row label {
      margin: 0; flex: 1; font-size: 0.85rem; color: var(--ink);
    }
    #settings .row input[type="checkbox"] { width: auto; }
    #settings .actions {
      display: flex; gap: 0.5rem; margin-top: 1.2rem;
    }
    #settings button {
      flex: 1; padding: 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font-size: 0.85rem;
      font-family: 'Georgia', serif;
      cursor: pointer;
    }
    #settings button.primary {
      background: var(--reply-ink);
      color: var(--bg);
      border-color: var(--reply-ink);
    }
    #settings button.danger { color: #b34f4f; }
    #settings button:disabled { cursor: not-allowed; opacity: 0.45; }
    #settings .settings-status {
      min-height: 1.1rem;
      margin-top: 0.55rem;
      color: #b34f4f;
      font-size: 0.72rem;
      line-height: 1.45;
    }
    #settings .note {
      font-size: 0.7rem; color: var(--muted); margin-top: 0.8rem;
      line-height: 1.4; opacity: 0.7;
    }
    #settings a { color: var(--reply-ink); }
    @media (max-width: 560px) {
      #settings { align-items: flex-end; }
      #settings .panel {
        width: 100%; max-height: 92vh;
        border-radius: 16px 16px 0 0;
        padding: 1.1rem;
      }
      #settings .profile-bar, #settings .settings-grid { grid-template-columns: 1fr; }
      #settings .field-wide { grid-column: auto; }
      #settings .profile-actions button { min-width: 0; }
    }
  </style>
</head>
<body>
  <canvas id="paper"></canvas>
  <div id="candle"></div>
  <div id="watermark">Geomancy</div>

  <button id="install-app" type="button" hidden>安装</button>
  <button id="gear" type="button" aria-label="打开设置" title="设置">⚙</button>

  <div id="guide">
    <div class="title">The Book of Geomancy Answers</div>
    <div class="hint">写上你的问题，地占答案之书将会为你解答。</div>
    <div class="gestures">
      <span>✍️ 写完后稍候</span>
      <span>🔄 翻转手写笔可擦除</span>
      <span>❓ 画一个问号查看提示</span>
      <span>⚙ 配置自己的 API</span>
    </div>
  </div>

  <div id="status"></div>

  <div id="settings">
    <div class="panel">
      <h2>答案之书的声音来自……</h2>
      <div class="profile-bar">
        <label>当前连接
          <select id="set-profile"></select>
        </label>
        <div class="profile-actions">
          <button id="set-profile-new" type="button">新增</button>
          <button id="set-profile-copy" type="button">复制</button>
          <button id="set-profile-delete" class="danger" type="button">删除</button>
        </div>
      </div>
      <div class="settings-grid">
        <label class="field-wide">连接名称
          <input type="text" id="set-profile-name" maxlength="40" placeholder="例如：我的视觉模型" autocomplete="off">
        </label>
        <label>模型提供方
          <select id="set-provider">
            <option value="anthropic">Anthropic Claude</option>
            <option value="openai">OpenAI</option>
            <option value="gemini">Google Gemini</option>
            <option value="custom">自定义（OpenAI 兼容）</option>
            <option value="anthropic-custom">自定义（Claude 协议）</option>
          </select>
        </label>
        <label>模型名称
          <input type="text" id="set-model" placeholder="例如：gpt-4o" autocomplete="off">
        </label>
        <label class="field-wide">API 密钥
          <input type="password" id="set-key" maxlength="10000" placeholder="仅保存在当前浏览器" autocomplete="off" spellcheck="false">
        </label>
        <label class="field-wide field-base" id="set-base-wrap">自定义 Base URL
          <input type="url" id="set-base" placeholder="例如：https://api.example.com/v1" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <div class="row">
        <label>OLED 纯黑模式</label>
        <input type="checkbox" id="set-dark">
      </div>
      <div class="settings-status" id="settings-status" role="status" aria-live="polite"></div>
      <div class="actions">
        <button id="set-cancel">取消</button>
        <button id="set-save" class="primary">保存设置</button>
      </div>
      <div class="note">
        所选模型必须支持图片输入。连接配置和 API 密钥只保存在当前浏览器；请求经本站 Cloudflare Worker 临时转发，不写入数据库。<br>
        <small>建议使用设有额度上限的受限密钥。未填写密钥时，会尝试站点默认通道（若已配置）。</small>
      </div>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.166.1/build/three.module.js" } }
  </script>
  <script type="module">
  import {
    ORACLE_SYSTEM_PROMPT,
    HANDWRITING_INSTRUCTION,
    deserializeGeomancyDraw,
    parseOracleReply,
  } from '/geomancy.js';

  (() => {
  'use strict';

  // ---- Config --------------------------------------------------------------
  const IDLE_MS = 2800;
  const FADE_DURATION = 1200;
  const ERASER_RADIUS = 30;
  const LINE_WIDTH = 2.5;
  const MIN_PRESSURE = 0.15;
  const REPLY_FONT_SIZE = 28;
  const REPLY_LINE_HEIGHT = 1.5;
  const REPLY_FONT_FAMILY = '"Kaiti SC", "STKaiti", "Songti SC", serif';

  const STANDALONE_APP = Boolean(
    (window.matchMedia && (
      window.matchMedia('(display-mode: standalone)').matches ||
      window.matchMedia('(display-mode: fullscreen)').matches ||
      window.matchMedia('(display-mode: minimal-ui)').matches
    )) || window.navigator.standalone === true
  );

  const DEFAULT_PROMPT = ORACLE_SYSTEM_PROMPT;

  const SETTINGS_KEY = 'riddle-settings-v2';
  const LEGACY_SETTINGS_KEY = 'riddle-settings';
  const PROVIDERS = {
    anthropic: { label: 'Anthropic Claude', model: 'claude-sonnet-4-6' },
    openai: { label: 'OpenAI', model: 'gpt-4o' },
    gemini: { label: 'Google Gemini', model: 'gemini-2.0-flash' },
    custom: { label: 'OpenAI 兼容', model: 'gpt-4o' },
    'anthropic-custom': { label: 'Claude 兼容', model: 'claude-sonnet-4-6' },
  };

  function createProfileId() {
    if (crypto && typeof crypto.randomUUID === 'function') return 'api-' + crypto.randomUUID();
    var values = new Uint32Array(2);
    crypto.getRandomValues(values);
    return 'api-' + values[0].toString(36) + values[1].toString(36);
  }

  function normalizeProfile(value, index) {
    value = value && typeof value === 'object' ? value : {};
    var provider = PROVIDERS[value.provider] ? value.provider : 'openai';
    return {
      id: String(value.id || createProfileId()),
      name: String(value.name || ('连接 ' + (index + 1))).slice(0, 40),
      provider: provider,
      model: String(value.model || PROVIDERS[provider].model).slice(0, 200),
      apiKey: String(value.apiKey || '').slice(0, 10000),
      baseUrl: String(value.baseUrl || '').slice(0, 2048),
    };
  }

  function normalizeSettings(value) {
    value = value && typeof value === 'object' ? value : {};
    var profiles = Array.isArray(value.profiles)
      ? value.profiles.slice(0, 30).map(normalizeProfile)
      : [];
    var seen = new Set();
    profiles.forEach(function(profile) {
      if (seen.has(profile.id)) profile.id = createProfileId();
      seen.add(profile.id);
    });
    if (!profiles.length) {
      profiles = [normalizeProfile({ id: 'default', name: '默认连接', provider: 'openai' }, 0)];
    }
    var activeProfileId = String(value.activeProfileId || profiles[0].id);
    if (!profiles.some(function(profile) { return profile.id === activeProfileId; })) {
      activeProfileId = profiles[0].id;
    }
    return {
      version: 2,
      dark: value.dark !== false,
      activeProfileId: activeProfileId,
      profiles: profiles,
    };
  }

  function loadSettings() {
    try {
      var current = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
      if (current) return normalizeSettings(current);

      var legacy = JSON.parse(localStorage.getItem(LEGACY_SETTINGS_KEY) || 'null');
      if (legacy) {
        return normalizeSettings({
          dark: legacy.dark,
          activeProfileId: 'default',
          profiles: [{
            id: 'default',
            name: '默认连接',
            provider: 'custom',
            model: legacy.model,
            apiKey: legacy.apiKey,
            baseUrl: legacy.baseUrl,
          }],
        });
      }
    } catch(e) {}
    return normalizeSettings(null);
  }

  function saveSettings(value) {
    settings = normalizeSettings(value || settings);
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      localStorage.removeItem(LEGACY_SETTINGS_KEY);
    } catch (error) {
      console.warn('无法将连接设置保存到当前浏览器。', error);
    }
    return settings;
  }

  function currentProfile() {
    return settings.profiles.find(function(profile) {
      return profile.id === settings.activeProfileId;
    }) || settings.profiles[0];
  }

  function providerLabel(provider) {
    return PROVIDERS[provider] ? PROVIDERS[provider].label : '未选择提供方';
  }

  var settings = loadSettings();

  // Apply theme
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', settings.dark ? 'dark' : 'light');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', settings.dark ? '#000000' : '#f5f0e6');
  }
  applyTheme();

  // ---- DOM -----------------------------------------------------------------
  var canvas = document.getElementById('paper');
  var ctx = canvas.getContext('2d', { willReadFrequently: false });
  var guideEl = document.getElementById('guide');
  var statusEl = document.getElementById('status');
  var gearEl = document.getElementById('gear');
  var installAppEl = document.getElementById('install-app');
  var settingsEl = document.getElementById('settings');

  // ---- Canvas sizing -------------------------------------------------------
  var dpr = window.devicePixelRatio || 1;
  var canvasWidth = 1, canvasHeight = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var w = rect.width || document.documentElement.clientWidth || window.innerWidth;
    var h = rect.height || document.documentElement.clientHeight || window.innerHeight;
    canvasWidth = Math.max(1, w);
    canvasHeight = Math.max(1, h);
    canvas.width = Math.max(1, Math.round(canvasWidth * dpr));
    canvas.height = Math.max(1, Math.round(canvasHeight * dpr));
    ctx.setTransform(canvas.width / canvasWidth, 0, 0, canvas.height / canvasHeight, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (Array.isArray(strokes) && strokes.length) redrawAllStrokes();
    if (three) three.dirty = true;
  }
  resize();
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('pageshow', function() { requestAnimationFrame(resize); });
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) requestAnimationFrame(function() { requestAnimationFrame(resize); });
  });

  // ---- Ink color from CSS var ----------------------------------------------
  function inkColor() {
    return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1a1a1a';
  }

  // ---- State ---------------------------------------------------------------
  var drawing = false, erasing = false;
  var lastX = 0, lastY = 0, lastP = 0;
  var strokes = [];
  var currentStroke = null;
  var idleTimer = null;
  var waiting = false, replyActive = false;

  // ---- Helpers --------------------------------------------------------------
  function getPoint(e) {
    var r = canvas.getBoundingClientRect();
    var scaleX = r.width ? canvasWidth / r.width : 1;
    var scaleY = r.height ? canvasHeight / r.height : 1;
    return {
      x: (e.clientX - r.left) * scaleX,
      y: (e.clientY - r.top) * scaleY,
      p: e.pressure > 0 ? e.pressure : 0.5,
      t: e.timeStamp,
    };
  }

  function showStatus(msg, dots) {
    statusEl.replaceChildren(document.createTextNode(msg));
    if (dots) {
      var dotsEl = document.createElement('span');
      dotsEl.id = 'thinking-dots';
      dotsEl.append(document.createElement('span'), document.createElement('span'), document.createElement('span'));
      statusEl.appendChild(dotsEl);
    }
    statusEl.classList.add('visible');
  }
  function hideStatus() { statusEl.classList.remove('visible'); }

  function hideGuide() {
    guideEl.classList.add('hidden');
    setTimeout(function() { guideEl.style.display = 'none'; }, 2000);
  }
  function showGuide() {
    guideEl.style.display = 'flex';
    guideEl.classList.remove('hidden');
  }

  function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

  // ---- 3D layer (ponytail: optional, app still works if it fails) ----------
  // 2D canvas stays as input + drawing surface; it's also uploaded to a tilted
  // plane via CanvasTexture. Parallax + sway only. No raycast input rewrite.
  var three = { dirty: true, ok: false };
  function markDirty() { three.dirty = true; }
  function initThree() {
    import('three').then(function(THREE) {
      try {
        var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setSize(canvasWidth, canvasHeight);
        Object.assign(renderer.domElement.style, {
          position: 'fixed', inset: '0', zIndex: '3', pointerEvents: 'none',
        });
        document.body.appendChild(renderer.domElement);
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(40, canvasWidth / canvasHeight, 0.1, 50);
        camera.position.set(0, -0.6, 4.4);
        camera.lookAt(0, 0, 0);
        var texture = new THREE.CanvasTexture(canvas);
        var H = 4.0;
        var plane = new THREE.Mesh(
          new THREE.PlaneGeometry(H * (canvasWidth / canvasHeight), H),
          new THREE.MeshBasicMaterial({ map: texture, transparent: true })
        );
        plane.rotation.x = -0.10;
        scene.add(plane);
        var mx = 0, my = 0;
        window.addEventListener('pointermove', function(e) {
          mx = (e.clientX / window.innerWidth) * 2 - 1;
          my = (e.clientY / window.innerHeight) * 2 - 1;
        });
        window.addEventListener('resize', function() {
          camera.aspect = canvasWidth / canvasHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(canvasWidth, canvasHeight);
          plane.geometry.dispose();
          plane.geometry = new THREE.PlaneGeometry(H * (canvasWidth / canvasHeight), H);
        });
        var t0 = performance.now();
        renderer.setAnimationLoop(function(now) {
          var t = (now - t0) / 1000;
          plane.rotation.y = Math.sin(t * 0.4) * 0.02 + mx * 0.08;
          plane.rotation.x = -0.12 + my * 0.06;
          if (three.dirty) { texture.needsUpdate = true; three.dirty = false; }
          renderer.render(scene, camera);
        });
        three.ok = true;
        document.body.classList.add('three-ok');   // hide 2D canvas, plane is the ink now
      } catch (e) { /* no WebGL, no 3D */ }
    }).catch(function() { /* no network, no 3D */ });
  }
  if (!STANDALONE_APP && matchMedia('(prefers-reduced-motion: no-preference)').matches) initThree();

  // ---- Drawing -------------------------------------------------------------
  function drawStrokeDot(target, point, color, baseAlpha, offsetX, offsetY) {
    var pressure = Math.max(point.p, MIN_PRESSURE);
    var diameter = LINE_WIDTH * (0.5 + pressure * 1.5);
    target.save();
    target.fillStyle = color;
    target.globalAlpha = baseAlpha * (0.82 + pressure * 0.18);
    target.beginPath();
    target.arc(point.x - (offsetX || 0), point.y - (offsetY || 0), Math.max(1, diameter / 2), 0, Math.PI * 2);
    target.fill();
    target.restore();
  }

  function startStroke(pt) {
    if (replyActive || waiting) return;
    hideGuide();
    currentStroke = [pt];
    strokes.push(currentStroke);
    drawing = true; erasing = false;
    ctx.beginPath();
    ctx.moveTo(pt.x, pt.y);
  }

  function continueStroke(pt) {
    if (!drawing) return;
    currentStroke.push(pt);
    var p = Math.max(pt.p, MIN_PRESSURE);
    var midX = (lastX + pt.x) / 2, midY = (lastY + pt.y) / 2;
    ctx.strokeStyle = inkColor();
    ctx.globalAlpha = 0.82 + p * 0.18;   // wet-ink variance
    ctx.lineWidth = LINE_WIDTH * (0.5 + p * 1.5);
    ctx.quadraticCurveTo(lastX, lastY, midX, midY);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.moveTo(midX, midY);
    lastX = pt.x; lastY = pt.y; lastP = p;
    markDirty();
  }

  function endStroke() {
    if (!drawing) return;
    if (currentStroke && currentStroke.length === 1) {
      drawStrokeDot(ctx, currentStroke[0], inkColor(), 1, 0, 0);
      markDirty();
    } else if (currentStroke && currentStroke.length > 1) {
      var endpoint = currentStroke[currentStroke.length - 1];
      var pressure = Math.max(endpoint.p, MIN_PRESSURE);
      ctx.strokeStyle = inkColor();
      ctx.globalAlpha = 0.82 + pressure * 0.18;
      ctx.lineWidth = LINE_WIDTH * (0.5 + pressure * 1.5);
      ctx.lineTo(endpoint.x, endpoint.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      markDirty();
    }
    drawing = false; currentStroke = null;
    scheduleIdle();
  }

  function eraseAt(x, y) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, ERASER_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    markDirty();
    strokes = strokes.map(function(s) {
      return s.filter(function(pt) { return Math.hypot(pt.x - x, pt.y - y) > ERASER_RADIUS; });
    }).filter(function(s) { return s.length > 0; });
  }

  // ---- Idle → commit -------------------------------------------------------
  function scheduleIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(commitPage, IDLE_MS); }
  function cancelIdle() { clearTimeout(idleTimer); }

  // ---- Commit --------------------------------------------------------------
  async function commitPage() {
    if (strokes.length === 0 || waiting || replyActive) return;

    if (detectQuestionMark()) { showGuide(); strokes = []; clearCanvas(); return; }

    waiting = true;
    showStatus('答案之书正在读取你的问题', true);
    await fadeOut();
    var png = exportPNG();
    clearCanvas();
    strokes = [];

    try {
      var reply = await askOracle(png);
      hideStatus();
      replyActive = true;
      await animateReply(reply.text, reply.isPrediction ? reply : null);
      replyActive = false;
    } catch(err) {
      showStatus('书页沉默了。' + (err.message || '请稍后再试。'));
      setTimeout(hideStatus, 4000);
    }
    waiting = false;
  }

  function detectQuestionMark() {
    if (strokes.length === 1 && strokes[0].length < 40) {
      var s = strokes[0];
      var xs = s.map(function(p) { return p.x; });
      var ys = s.map(function(p) { return p.y; });
      var w = Math.max.apply(null, xs) - Math.min.apply(null, xs);
      var h = Math.max.apply(null, ys) - Math.min.apply(null, ys);
      if (w < 60 && h < 80) return true;
    }
    return false;
  }

  function fadeOut() {
    return new Promise(function(resolve) {
      var alpha = 1, step = 0.04;
      var interval = setInterval(function() {
        alpha -= step;
        if (alpha <= 0) { clearInterval(interval); ctx.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr); resolve(); }
        ctx.clearRect(0, 0, canvas.width/dpr, canvas.height/dpr);
        ctx.save();
        ctx.globalAlpha = alpha;
        redrawAllStrokes();
        ctx.restore();
        markDirty();
      }, FADE_DURATION * step);
    });
  }

  function redrawAllStrokes() {
    var ic = inkColor();
    var fade = ctx.globalAlpha;   // respect caller's fade alpha (set by fadeOut)
    for (var si = 0; si < strokes.length; si++) {
      var stroke = strokes[si];
      if (stroke.length === 1) {
        drawStrokeDot(ctx, stroke[0], ic, fade, 0, 0);
        continue;
      }
      if (stroke.length < 2) continue;
      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for (var i = 1; i < stroke.length; i++) {
        var p = stroke[i], prev = stroke[i-1];
        var midX = (prev.x + p.x)/2, midY = (prev.y + p.y)/2;
        var press = Math.max(p.p, MIN_PRESSURE);
        ctx.lineWidth = LINE_WIDTH * (0.5 + press * 1.5);
        ctx.strokeStyle = ic;
        ctx.globalAlpha = fade * (0.82 + press * 0.18);
        ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(midX, midY);
      }
      var endpoint = stroke[stroke.length - 1];
      var endPressure = Math.max(endpoint.p, MIN_PRESSURE);
      ctx.lineWidth = LINE_WIDTH * (0.5 + endPressure * 1.5);
      ctx.globalAlpha = fade * (0.82 + endPressure * 0.18);
      ctx.lineTo(endpoint.x, endpoint.y);
      ctx.stroke();
    }
    ctx.globalAlpha = fade;
  }

  function exportPNG() {
    var minX = canvasWidth, minY = canvasHeight, maxX = 0, maxY = 0;
    strokes.forEach(function(stroke) {
      stroke.forEach(function(point) {
        minX = Math.min(minX, point.x); minY = Math.min(minY, point.y);
        maxX = Math.max(maxX, point.x); maxY = Math.max(maxY, point.y);
      });
    });

    // Send the handwriting, not a mostly empty full-screen page. A generous
    // border keeps dots and line caps intact; small writing is enlarged up to 2×.
    var span = Math.max(maxX - minX, maxY - minY);
    var padding = Math.max(32, Math.min(72, span * 0.12));
    var left = Math.max(0, Math.floor(minX - padding));
    var top = Math.max(0, Math.floor(minY - padding));
    var right = Math.min(canvasWidth, Math.ceil(maxX + padding));
    var bottom = Math.min(canvasHeight, Math.ceil(maxY + padding));
    var w = Math.max(1, right - left), h = Math.max(1, bottom - top);
    var exportScale = Math.max(1, Math.min(2, 768 / Math.max(w, h)));
    var tmp = document.createElement('canvas');
    tmp.width = Math.max(1, Math.round(w * exportScale));
    tmp.height = Math.max(1, Math.round(h * exportScale));
    var t = tmp.getContext('2d');
    t.setTransform(tmp.width / w, 0, 0, tmp.height / h, 0, 0);
    // Use CSS bg color for export
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#f5f0e6';
    t.fillStyle = bg;
    t.fillRect(0, 0, w, h);
    var ic = inkColor();
    for (var si = 0; si < strokes.length; si++) {
      var stroke = strokes[si];
      if (stroke.length === 1) {
        drawStrokeDot(t, stroke[0], ic, 1, left, top);
        continue;
      }
      if (stroke.length < 2) continue;
      t.beginPath();
      t.moveTo(stroke[0].x - left, stroke[0].y - top);
      for (var i = 1; i < stroke.length; i++) {
        var p = stroke[i], prev = stroke[i-1];
        var midX = (prev.x + p.x)/2 - left, midY = (prev.y + p.y)/2 - top;
        var press = Math.max(p.p, MIN_PRESSURE);
        t.lineWidth = LINE_WIDTH * (0.5 + press * 1.5);
        t.strokeStyle = ic;
        t.globalAlpha = 0.82 + press * 0.18;
        t.lineCap = 'round'; t.lineJoin = 'round';
        t.quadraticCurveTo(prev.x - left, prev.y - top, midX, midY);
        t.stroke();
        t.beginPath();
        t.moveTo(midX, midY);
      }
      var endpoint = stroke[stroke.length - 1];
      var endPressure = Math.max(endpoint.p, MIN_PRESSURE);
      t.lineWidth = LINE_WIDTH * (0.5 + endPressure * 1.5);
      t.globalAlpha = 0.82 + endPressure * 0.18;
      t.lineTo(endpoint.x - left, endpoint.y - top);
      t.stroke();
    }
    t.globalAlpha = 1;
    return tmp.toDataURL('image/png');
  }

  function clearCanvas() { ctx.clearRect(0, 0, canvasWidth, canvasHeight); markDirty(); }

  // ---- Oracle: five provider types through the same-origin Worker ----------

  function imageParts(pngDataUrl) {
    var match = String(pngDataUrl).match(/^data:([^;]+);base64,(.+)$/);
    if (!match) throw new Error('无法读取手写内容。');
    return { mime: match[1], base64: match[2] };
  }

  function providerEndpoint(profile) {
    var base;
    if (profile.provider === 'anthropic') return 'https://api.anthropic.com/v1/messages';
    if (profile.provider === 'openai') return 'https://api.openai.com/v1/chat/completions';
    if (profile.provider === 'gemini') {
      return 'https://generativelanguage.googleapis.com/v1beta/models/' +
        encodeURIComponent(profile.model || PROVIDERS.gemini.model) + ':streamGenerateContent?alt=sse';
    }

    base = String(profile.baseUrl || '').trim().replace(/\/+$/, '');
    if (!base) throw new Error('请先在设置中填写自定义 Base URL。');
    if (profile.provider === 'anthropic-custom') {
      return /\/messages$/i.test(base) ? base : (/\/v1$/i.test(base) ? base + '/messages' : base + '/v1/messages');
    }
    return /\/chat\/completions$/i.test(base) ? base : base + '/chat/completions';
  }

  function buildProviderRequest(profile, pngDataUrl) {
    var image = imageParts(pngDataUrl);
    var instruction = HANDWRITING_INSTRUCTION;

    if (profile.provider === 'anthropic' || profile.provider === 'anthropic-custom') {
      return {
        protocol: 'anthropic',
        payload: {
          model: profile.model || PROVIDERS[profile.provider].model,
          max_tokens: 1000,
          stream: true,
          system: DEFAULT_PROMPT,
          messages: [{
            role: 'user',
            content: [
              { type: 'image', source: { type: 'base64', media_type: image.mime, data: image.base64 } },
              { type: 'text', text: instruction },
            ],
          }],
        },
      };
    }

    if (profile.provider === 'gemini') {
      return {
        protocol: 'gemini',
        payload: {
          system_instruction: { parts: [{ text: DEFAULT_PROMPT }] },
          contents: [{
            role: 'user',
            parts: [
              { inline_data: { mime_type: image.mime, data: image.base64 } },
              { text: instruction },
            ],
          }],
          generationConfig: { maxOutputTokens: 1000, temperature: 0.7 },
        },
      };
    }

    return {
      protocol: 'openai',
      payload: {
        model: profile.model || PROVIDERS[profile.provider].model,
        stream: true,
        messages: [
          { role: 'system', content: DEFAULT_PROMPT },
          { role: 'user', content: [
            { type: 'image_url', image_url: { url: pngDataUrl } },
            { type: 'text', text: instruction },
          ]},
        ],
        max_tokens: 1000,
        temperature: 0.7,
      },
    };
  }

  function textFromProviderJson(json, protocol, streaming) {
    if (!json || typeof json !== 'object') return '';
    if (protocol === 'anthropic') {
      if (streaming && json.delta && typeof json.delta.text === 'string') return json.delta.text;
      if (streaming && json.content_block && typeof json.content_block.text === 'string') return json.content_block.text;
      return Array.isArray(json.content)
        ? json.content.map(function(part) { return part && part.text ? part.text : ''; }).join('')
        : '';
    }
    if (protocol === 'gemini') {
      var parts = json.candidates && json.candidates[0] && json.candidates[0].content
        ? json.candidates[0].content.parts
        : [];
      return Array.isArray(parts)
        ? parts.map(function(part) { return part && part.text ? part.text : ''; }).join('')
        : '';
    }

    var choice = json.choices && json.choices[0];
    var message = choice ? (streaming ? choice.delta : choice.message) : null;
    var content = message && message.content;
    if (typeof content === 'string') return content;
    if (Array.isArray(content)) {
      return content.map(function(part) { return part && (part.text || part.content) || ''; }).join('');
    }
    return typeof json.text === 'string' ? json.text : '';
  }

  async function responseError(response) {
    var raw = '';
    try { raw = await response.text(); } catch(e) {}
    try {
      var json = JSON.parse(raw);
      var error = json && json.error;
      if (typeof error === 'string') return error;
      if (error && error.message) return error.message;
      if (json && json.message) return json.message;
    } catch(e) {}
    return raw.slice(0, 180) || ('请求失败（HTTP ' + response.status + '）');
  }

  async function readProviderResponse(response, protocol) {
    var contentType = response.headers.get('content-type') || '';
    if (!response.body || contentType.includes('application/json')) {
      var json = await response.json();
      var complete = textFromProviderJson(json, protocol, false).trim();
      if (!complete) throw new Error('模型没有返回可显示的正文。');
      return complete;
    }

    var reader = response.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    var fullReply = '';

    function consume(line) {
      var value = line.trim();
      if (!value || value.startsWith(':') || value.startsWith('event:')) return;
      if (value.startsWith('data:')) value = value.slice(5).trim();
      if (!value || value === '[DONE]') return;
      try { fullReply += textFromProviderJson(JSON.parse(value), protocol, true); } catch(e) {}
    }

    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop();
      lines.forEach(consume);
    }
    buffer += decoder.decode();
    consume(buffer);
    fullReply = fullReply.trim();
    if (!fullReply) throw new Error('模型没有返回可显示的正文，请确认所选模型支持图片输入。');
    return fullReply;
  }

  async function askOracle(pngDataUrl) {
    var profile = currentProfile();
    var response;
    var protocol;

    try {
      if (!profile.apiKey) {
        response = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: pngDataUrl }),
        });
        if (!response.ok) throw new Error(await responseError(response));
        protocol = 'openai';
      } else {
        var request = buildProviderRequest(profile, pngDataUrl);
        protocol = request.protocol;
        response = await fetch('/api/proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            protocol: request.protocol,
            url: providerEndpoint(profile),
            apiKey: profile.apiKey,
            payload: request.payload,
          }),
        });
        if (!response.ok) throw new Error(await responseError(response));
      }

      var draw = deserializeGeomancyDraw(response.headers.get('X-Geomancy-Draw'));
      var text = await readProviderResponse(response, protocol);
      return parseOracleReply(text, draw);
    } catch(error) {
      if (error instanceof TypeError || (error && error.name === 'AbortError')) {
        throw new Error('网络连接失败，答案之书暂时无法回应。');
      }
      if (error instanceof Error && error.message) throw error;
      throw new Error('网络连接失败，答案之书暂时无法回应。');
    }
  }

  function splitReplyUnits(text) {
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      return Array.from(new Intl.Segmenter('zh-CN', { granularity: 'word' }).segment(text), function(item) {
        return item.segment;
      });
    }
    return String(text).match(/[\u3400-\u9fff]|[^\u3400-\u9fff\s]+|\s+/g) || [];
  }

  // ---- Reply animation: Chinese-aware SVG ink fade-in -----------------------
  function appendSvgText(parent, text, x, y, fontSize, color, opacity) {
    var svgNS = 'http://www.w3.org/2000/svg';
    var element = document.createElementNS(svgNS, 'text');
    element.setAttribute('x', x);
    element.setAttribute('y', y);
    element.setAttribute('text-anchor', 'middle');
    element.setAttribute('font-family', REPLY_FONT_FAMILY);
    element.setAttribute('font-size', fontSize);
    element.setAttribute('fill', color);
    element.setAttribute('opacity', opacity);
    element.textContent = text;
    parent.appendChild(element);
  }

  function appendGeomancyFigure(parent, pattern, centerX, top, color, compact) {
    var svgNS = 'http://www.w3.org/2000/svg';
    var rowGap = compact ? 16 : 19;
    var pointGap = compact ? 8 : 10;
    var pointSize = compact ? 6 : 7;

    pattern.forEach(function(points, row) {
      var offsets = points === 1 ? [0] : [-pointGap, pointGap];
      offsets.forEach(function(offset) {
        var centerY = top + row * rowGap;
        var point = document.createElementNS(svgNS, 'rect');
        point.setAttribute('x', centerX + offset - pointSize / 2);
        point.setAttribute('y', centerY - pointSize / 2);
        point.setAttribute('width', pointSize);
        point.setAttribute('height', pointSize);
        point.setAttribute('rx', '0.8');
        point.setAttribute('fill', color);
        point.setAttribute('transform', 'rotate(45 ' + (centerX + offset) + ' ' + centerY + ')');
        parent.appendChild(point);
      });
    });
  }

  function appendGeomancyCombination(svg, oracle, width, height, color) {
    var svgNS = 'http://www.w3.org/2000/svg';
    var compact = width < 520;
    var top = Math.max(compact ? 54 : 64, height * 0.075);
    var spread = Math.min(width * 0.29, 180);
    var centers = [width / 2 - spread, width / 2, width / 2 + spread];
    var rowGap = compact ? 16 : 19;
    var labelY = top + rowGap * 3 + (compact ? 28 : 34);
    var metaY = labelY + (compact ? 30 : 36);
    var group = document.createElementNS(svgNS, 'g');
    group.style.opacity = '0';
    group.style.filter = 'blur(4px)';
    group.style.transition = 'opacity 1.2s ease, filter 1.4s ease';
    svg.appendChild(group);

    appendGeomancyFigure(group, oracle.draw.patterns.left, centers[0], top, color, compact);
    appendGeomancyFigure(group, oracle.draw.patterns.right, centers[1], top, color, compact);
    appendGeomancyFigure(group, oracle.draw.patterns.result, centers[2], top, color, compact);
    appendSvgText(group, '+', (centers[0] + centers[1]) / 2, top + rowGap * 1.7, compact ? 18 : 22, color, '0.55');
    appendSvgText(group, '=', (centers[1] + centers[2]) / 2, top + rowGap * 1.7, compact ? 18 : 22, color, '0.55');
    appendSvgText(group, oracle.draw.left, centers[0], labelY, compact ? 14 : 16, color, '0.78');
    appendSvgText(group, oracle.draw.right, centers[1], labelY, compact ? 14 : 16, color, '0.78');
    appendSvgText(group, oracle.draw.result, centers[2], labelY, compact ? 14 : 16, color, '0.92');
    appendSvgText(group, '第 ' + oracle.draw.id + ' 组 · ' + oracle.topic, width / 2, metaY, compact ? 13 : 15, color, '0.62');

    setTimeout(function() {
      group.style.opacity = '0.94';
      group.style.filter = 'blur(0px)';
    }, 20);
    return metaY + (compact ? 46 : 54);
  }

  async function animateReply(text, oracle) {
    if (!text) return;
    var w = window.innerWidth, h = window.innerHeight;
    var maxWidth = w * 0.84, startX = w * 0.08;
    var fontSize = w < 480 ? (h < 700 ? 20 : 22) : REPLY_FONT_SIZE;

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', (oracle
      ? oracle.draw.left + '加' + oracle.draw.right + '得到' + oracle.draw.result + '，主题' + oracle.topic + '。'
      : '') + text);
    svg.style.position = 'absolute';
    svg.style.top = '0'; svg.style.left = '0';
    svg.style.pointerEvents = 'none';
    svg.style.zIndex = '5';
    document.body.appendChild(svg);

    var replyColor = getComputedStyle(document.documentElement).getPropertyValue('--reply-ink').trim() || '#3a3028';
    var startY = oracle ? appendGeomancyCombination(svg, oracle, w, h, replyColor) : h * 0.18;

    var words = splitReplyUnits(text);
    var x = startX, y = startY;
    var lineHeight = fontSize * REPLY_LINE_HEIGHT;
    var maxRight = startX + maxWidth;

    var mc = document.createElement('canvas');
    var mctx = mc.getContext('2d');
    mctx.font = fontSize + 'px ' + REPLY_FONT_FAMILY;

    var wordSpans = [];
    for (var wi = 0; wi < words.length; wi++) {
      var pieces = String(words[wi] || '').split(/(\n)/);
      for (var pi = 0; pi < pieces.length; pi++) {
        var word = pieces[pi];
        if (!word) continue;
        if (word === '\n') { x = startX; y += lineHeight; continue; }
        var ww = mctx.measureText(word).width;
        if (word.trim() && x + ww > maxRight) { x = startX; y += lineHeight; }
        if (!word.trim() && x === startX) continue;
        wordSpans.push({ text: word, x: x, y: y });
        x += ww;
      }
    }

    var delay = Math.max(35, Math.min(110, 7000 / Math.max(1, wordSpans.length)));
    for (var i = 0; i < wordSpans.length; i++) {
      var ws = wordSpans[i];
      var el = document.createElementNS(svgNS, 'text');
      el.setAttribute('x', ws.x);
      el.setAttribute('y', ws.y);
      el.setAttribute('font-family', REPLY_FONT_FAMILY);
      el.setAttribute('font-size', fontSize);
      el.setAttribute('fill', replyColor);
      el.style.opacity = '0';
      el.style.filter = 'blur(3px)';
      el.style.transition = 'opacity 0.9s ease, filter 1.1s ease';
      el.textContent = ws.text;
      svg.appendChild(el);
      (function(elm) {
        setTimeout(function() {
          elm.style.opacity = '0.92';
          elm.style.filter = 'blur(0px)';
        }, 0);
      })(el);
      await sleep(delay);
    }

    await sleep(Math.min(10000, Math.max(3500, text.length * 35)));
    svg.style.transition = 'opacity 2s ease';
    svg.style.opacity = '0';
    await sleep(2000);
    svg.remove();
  }

  // ---- Settings panel ------------------------------------------------------
  var setProfile = document.getElementById('set-profile');
  var setProfileName = document.getElementById('set-profile-name');
  var setProvider = document.getElementById('set-provider');
  var setKey = document.getElementById('set-key');
  var setBase = document.getElementById('set-base');
  var setBaseWrap = document.getElementById('set-base-wrap');
  var setModel = document.getElementById('set-model');
  var setDark = document.getElementById('set-dark');
  var settingsStatus = document.getElementById('settings-status');
  var deleteProfileButton = document.getElementById('set-profile-delete');

  function isCustomProvider(provider) {
    return provider === 'custom' || provider === 'anthropic-custom';
  }

  function setSettingsStatus(message) {
    settingsStatus.textContent = message || '';
  }

  function renderProfileSelect() {
    setProfile.replaceChildren();
    settings.profiles.forEach(function(profile) {
      var option = document.createElement('option');
      option.value = profile.id;
      option.textContent = profile.name + ' · ' + providerLabel(profile.provider) + ' · ' + profile.model;
      option.selected = profile.id === settings.activeProfileId;
      setProfile.appendChild(option);
    });
    deleteProfileButton.disabled = settings.profiles.length <= 1;
  }

  function syncBaseVisibility() {
    setBaseWrap.hidden = !isCustomProvider(setProvider.value);
  }

  function syncSettingsForm() {
    var profile = currentProfile();
    renderProfileSelect();
    setProfileName.value = profile.name;
    setProvider.value = profile.provider;
    setProvider.dataset.previous = profile.provider;
    setModel.value = profile.model;
    setKey.value = profile.apiKey;
    setBase.value = profile.baseUrl;
    setDark.checked = settings.dark;
    syncBaseVisibility();
    setSettingsStatus('');
  }

  function validCustomBase(profile) {
    if (!isCustomProvider(profile.provider) || !profile.apiKey) return true;
    if (!profile.baseUrl) {
      setSettingsStatus('使用自定义协议时，请填写 Base URL。');
      return false;
    }
    try {
      var url = new URL(profile.baseUrl);
      if (url.protocol !== 'https:' || url.username || url.password || url.hash) throw new Error();
    } catch(e) {
      setSettingsStatus('Base URL 必须是公开的 HTTPS 地址，且不能包含账号、密码或片段。');
      return false;
    }
    return true;
  }

  function persistSettingsForm(validate) {
    var profile = currentProfile();
    profile.name = (setProfileName.value.trim() || '未命名连接').slice(0, 40);
    profile.provider = PROVIDERS[setProvider.value] ? setProvider.value : 'openai';
    profile.model = (setModel.value.trim() || PROVIDERS[profile.provider].model).slice(0, 200);
    profile.apiKey = setKey.value.trim().slice(0, 10000);
    profile.baseUrl = setBase.value.trim().replace(/\/+$/, '').slice(0, 2048);
    settings.dark = setDark.checked;
    if (validate && !validCustomBase(profile)) return false;
    saveSettings(settings);
    return true;
  }

  function openSettings() {
    syncSettingsForm();
    settingsEl.classList.add('open');
    setTimeout(function() { setProfileName.focus(); }, 40);
  }
  function closeSettings() {
    settingsEl.classList.remove('open');
    setSettingsStatus('');
  }

  gearEl.addEventListener('click', openSettings);
  document.getElementById('set-cancel').addEventListener('click', closeSettings);
  document.getElementById('set-save').addEventListener('click', function() {
    if (!persistSettingsForm(true)) return;
    applyTheme();
    closeSettings();
  });

  setProfile.addEventListener('change', function(event) {
    persistSettingsForm(false);
    if (settings.profiles.some(function(profile) { return profile.id === event.target.value; })) {
      settings.activeProfileId = event.target.value;
      saveSettings(settings);
    }
    syncSettingsForm();
  });

  document.getElementById('set-profile-new').addEventListener('click', function() {
    if (settings.profiles.length >= 30) {
      setSettingsStatus('最多保存 30 套连接。');
      return;
    }
    persistSettingsForm(false);
    var profile = normalizeProfile({
      id: createProfileId(),
      name: '连接 ' + (settings.profiles.length + 1),
      provider: 'openai',
    }, settings.profiles.length);
    settings.profiles.push(profile);
    settings.activeProfileId = profile.id;
    saveSettings(settings);
    syncSettingsForm();
    setProfileName.select();
  });

  document.getElementById('set-profile-copy').addEventListener('click', function() {
    if (settings.profiles.length >= 30) {
      setSettingsStatus('最多保存 30 套连接。');
      return;
    }
    persistSettingsForm(false);
    var source = currentProfile();
    var copy = normalizeProfile(Object.assign({}, source, {
      id: createProfileId(),
      name: (source.name + ' 副本').slice(0, 40),
    }), settings.profiles.length);
    settings.profiles.push(copy);
    settings.activeProfileId = copy.id;
    saveSettings(settings);
    syncSettingsForm();
  });

  deleteProfileButton.addEventListener('click', function() {
    if (settings.profiles.length <= 1) {
      setSettingsStatus('至少保留一套连接。');
      return;
    }
    var removedId = settings.activeProfileId;
    settings.profiles = settings.profiles.filter(function(profile) { return profile.id !== removedId; });
    settings.activeProfileId = settings.profiles[0].id;
    saveSettings(settings);
    syncSettingsForm();
  });

  setProvider.addEventListener('change', function() {
    var previous = setProvider.dataset.previous;
    var previousModel = PROVIDERS[previous] ? PROVIDERS[previous].model : '';
    if (!setModel.value.trim() || setModel.value.trim() === previousModel) {
      setModel.value = PROVIDERS[setProvider.value].model;
    }
    setProvider.dataset.previous = setProvider.value;
    syncBaseVisibility();
    setSettingsStatus('');
  });

  settingsEl.addEventListener('click', function(e) {
    if (e.target === settingsEl) closeSettings();
  });

  // ---- PWA installation -----------------------------------------------------
  var pendingInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function(event) {
    event.preventDefault();
    pendingInstallPrompt = event;
    installAppEl.hidden = false;
  });

  installAppEl.addEventListener('click', async function() {
    if (!pendingInstallPrompt) return;
    await pendingInstallPrompt.prompt();
    await pendingInstallPrompt.userChoice;
    pendingInstallPrompt = null;
    installAppEl.hidden = true;
  });

  window.addEventListener('appinstalled', function() {
    pendingInstallPrompt = null;
    installAppEl.hidden = true;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').catch(function(error) {
        console.warn('离线服务注册失败：', error);
      });
    });
  }

  // ---- Pointer events ------------------------------------------------------
  canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault(); cancelIdle();
    if (e.button === 2 || e.tiltY > 40 || (e.buttons & 2)) {
      erasing = true; var pt = getPoint(e); eraseAt(pt.x, pt.y); return;
    }
    var pt = getPoint(e);
    lastX = pt.x; lastY = pt.y; lastP = pt.p;
    startStroke(pt);
  });
  canvas.addEventListener('pointermove', function(e) {
    e.preventDefault();
    if (erasing) { var pt = getPoint(e); eraseAt(pt.x, pt.y); return; }
    if (!drawing) return;
    continueStroke(getPoint(e));
  });
  canvas.addEventListener('pointerup', function(e) {
    e.preventDefault();
    if (erasing) { erasing = false; scheduleIdle(); return; }
    endStroke();
  });
  canvas.addEventListener('pointercancel', function() {
    if (erasing) { erasing = false; scheduleIdle(); return; }
    endStroke();
  });
  canvas.addEventListener('pointerleave', function() { if (drawing) endStroke(); });
  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (settingsEl.classList.contains('open')) { closeSettings(); return; }
      cancelIdle(); clearCanvas(); strokes = [];
      waiting = false; replyActive = false; hideStatus();
    }
  });

  document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
  scheduleIdle();
  })();
  </script>
</body>
</html>
