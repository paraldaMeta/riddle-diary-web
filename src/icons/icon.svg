<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Gs Diary · The Geomancer’s Book of Answers</title>
  <desc id="description">An artistic gold Gs mark on a dark enchanted diary cover.</desc>
  <defs>
    <radialGradient id="cover" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#21170f"/>
      <stop offset="0.58" stop-color="#0b0806"/>
      <stop offset="1" stop-color="#020201"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0c7"/>
      <stop offset="0.35" stop-color="#d7b46d"/>
      <stop offset="0.7" stop-color="#8d692f"/>
      <stop offset="1" stop-color="#f0d291"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#050403"/>
  <rect x="62" y="50" width="388" height="412" rx="42" fill="url(#cover)" stroke="#58411f" stroke-width="5"/>
  <rect x="82" y="70" width="348" height="372" rx="31" fill="none" stroke="#b58a44" stroke-opacity="0.48" stroke-width="3"/>
  <path d="M106 97C173 78 339 78 406 97M106 415C173 434 339 434 406 415" fill="none" stroke="#d6b269" stroke-opacity="0.24" stroke-width="3"/>
  <text x="256" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="188" font-weight="700" font-style="italic" letter-spacing="-18" fill="url(#gold)" filter="url(#glow)">Gs</text>
  <path d="M158 314c38 13 118 19 196 0" fill="none" stroke="#d7b46d" stroke-width="4" stroke-linecap="round" opacity="0.66"/>
  <text x="256" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="42" letter-spacing="8" fill="url(#gold)">Diary</text>
  <text x="256" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="1.2" fill="#d7b46d" opacity="0.72">The Geomancer’s Book of Answers</text>
